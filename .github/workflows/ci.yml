name: CI

# Capa 2 del gate (ver AGENTS.md): corre en cada PR y en push a main.
#  - backend: suite hermética sin LLM real ni red (SQLite temporal, API Brasper simulada) + evals de escenarios
#  - web: type-check + build del panel Next.js + Lighthouse (performance/a11y)
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · run_checks (sin LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Doctests de policies (primitivas puras)
        working-directory: backend
        run: python -m doctest core/policies.py
      - name: Gate de producción
        working-directory: backend
        env:
          APP_ENV: development
          PYTHONIOENCODING: utf-8
        run: python tests/run_checks.py
      - name: Evals de escenarios ES/PT (deterministas, sin LLM real)
        working-directory: backend
        env:
          APP_ENV: development
          PYTHONIOENCODING: utf-8
        run: python tests/evals/run.py

  web:
    name: Panel · type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Lighthouse (performance >= 90, accesibilidad >= 95)
        # Sin backend: /conversaciones muestra el login, /consumo la carcasa. Mide el shell del panel.
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: web/.lighthouseci
          retention-days: 7
